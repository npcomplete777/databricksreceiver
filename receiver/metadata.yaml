type: databricks

status:
  class: receiver
  stability:
    alpha: [metrics]
  distributions: []
  codeowners:
    active: [npcomplete777]

resource_attributes:
  databricks.workspace.host:
    description: The Databricks workspace host URL
    type: string
    enabled: true
  databricks.workspace.id:
    description: The Databricks workspace ID
    type: string
    enabled: false
  service.name:
    description: Logical name of the service
    type: string
    enabled: true
  service.version:
    description: Version of the receiver
    type: string
    enabled: true

attributes:
  databricks.job.name:
    description: The name of the Databricks job
    type: string
  databricks.job.id:
    description: The unique identifier of the Databricks job
    type: string
  databricks.job.run.id:
    description: The unique identifier of the job run
    type: string
  databricks.job.state:
    description: The result state of the job or task
    type: string
    enum: [SUCCESS, FAILED, TIMEOUT, CANCELED, RUNNING, PENDING, TERMINATING, TERMINATED, SKIPPED, INTERNAL_ERROR]
  databricks.task.key:
    description: The unique key identifying a task within a job
    type: string
  databricks.warehouse.state:
    description: The state of the SQL warehouse
    type: string
    enum: [RUNNING, STOPPED, STARTING, STOPPING, DELETING, DELETED]
  databricks.workspace.object.type:
    description: The type of workspace object
    type: string
    enum: [NOTEBOOK, DIRECTORY, LIBRARY, REPO, FILE]
  databricks.user.status:
    description: The status of the user account
    type: string
    enum: [active, inactive]
  databricks.group.name:
    description: The display name of the group
    type: string
  databricks.token.comment:
    description: The comment or description associated with the token
    type: string
  databricks.cluster.id:
    description: The unique identifier of the cluster
    type: string
  databricks.policy.type:
    description: The type of cluster policy
    type: string
    enum: [default, custom]

metrics:
  databricks.job.count:
    enabled: true
    description: Total number of jobs in the workspace
    unit: "{job}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
  
  databricks.job.run.count:
    enabled: true
    description: Number of job runs by state
    unit: "{run}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [databricks.job.state]
  
  databricks.job.run.duration:
    enabled: true
    description: Duration of job run from start to completion
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.job.name, databricks.job.state]
  
  databricks.job.duration.queue:
    enabled: true
    description: Time spent in queue before job execution starts
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.job.name]
  
  databricks.job.duration.setup:
    enabled: true
    description: Time spent setting up the job execution environment
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.job.name]
  
  databricks.job.duration.execution:
    enabled: true
    description: Time spent executing the job workload
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.job.name]
  
  databricks.job.duration.cleanup:
    enabled: true
    description: Time spent cleaning up after job completion
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.job.name]
  
  databricks.job.success_rate:
    enabled: true
    description: Percentage of successful job completions
    unit: "1"
    gauge:
      value_type: double
  
  databricks.job.cost.estimate:
    enabled: true
    description: Estimated cost of job execution in USD (custom unit, not UCUM)
    unit: "{USD}"
    gauge:
      value_type: double
    attributes: [databricks.job.name, databricks.cluster.id]
  
  databricks.task.duration:
    enabled: true
    description: Duration of task execution
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.task.key, databricks.job.state]
  
  databricks.task.setup_duration:
    enabled: true
    description: Duration of task setup phase
    unit: ms
    gauge:
      value_type: int
    attributes: [databricks.task.key]
  
  databricks.warehouse.count:
    enabled: true
    description: Number of SQL warehouses by state
    unit: "{warehouse}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [databricks.warehouse.state]
  
  databricks.workspace.object.count:
    enabled: true
    description: Number of workspace objects by type
    unit: "{object}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [databricks.workspace.object.type]
  
  databricks.dbfs.storage.usage:
    enabled: true
    description: Total storage consumed in DBFS
    unit: By
    gauge:
      value_type: int
  
  databricks.dbfs.file.count:
    enabled: true
    description: Number of files and directories in DBFS
    unit: "{file}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
  
  databricks.token.count:
    enabled: true
    description: Number of active access tokens
    unit: "{token}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
  
  databricks.token.expiry:
    enabled: true
    description: Days remaining until token expiration
    unit: d
    gauge:
      value_type: int
    attributes: [databricks.token.comment]
  
  databricks.user.count:
    enabled: true
    description: Number of users by status
    unit: "{user}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [databricks.user.status]
  
  databricks.group.count:
    enabled: true
    description: Total number of groups in the workspace
    unit: "{group}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
  
  databricks.group.member.count:
    enabled: true
    description: Number of members in each group
    unit: "{member}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [databricks.group.name]
  
  databricks.policy.count:
    enabled: true
    description: Total number of cluster policies
    unit: "{policy}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
  
  databricks.policy.by_type.count:
    enabled: true
    description: Number of cluster policies by type
    unit: "{policy}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [databricks.policy.type]
  
  databricks.receiver.scrape.errors:
    enabled: true
    description: Number of API endpoints that failed during the scrape operation
    unit: "{error}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
